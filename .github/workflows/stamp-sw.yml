name: Validate service worker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check sw.js
          node --check config.js
      - name: Validate versioned PWA contract
        run: |
          grep -Fq 'searchParams.get("v")' sw.js
          grep -Fq './app.bundle.js' sw.js
          grep -Eq 'version: "[^"]+"' config.js
