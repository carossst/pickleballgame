name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Use current npm
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Coverage thresholds
        run: npm run test:coverage
      - name: Formatting
        run: npm run format:check
      - name: Verify generated production assets
        run: |
          npm run build:assets
          git diff --exit-code -- app.bundle.js style.css
      - name: Verify generated SEO pages
        run: |
          npm run publish:seo
          git diff --exit-code -- quiz rules sitemap.xml
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:smoke
      - name: Critical browser flows
        run: npm run test:critical
      - name: Accessibility tests
        run: npm run test:a11y
