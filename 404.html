<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#38bdf8" media="(prefers-color-scheme: light)">
    <link rel="manifest" href="./manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Pickleball Rules Quiz">
    <meta name="description" content="Page not found. Return to Pickleball Rules Quiz." data-wt-meta-description="meta.notFoundDescription">

    <title data-wt-wording="meta.notFoundTitle">Page not found - Pickleball Rules Quiz</title>
    <link rel="canonical" href="https://pickleballrulesquiz.com/404.html">
    <link rel="alternate" hreflang="en" href="https://pickleballrulesquiz.com/404.html?lang=en">
    <link rel="alternate" hreflang="fr" href="https://pickleballrulesquiz.com/404.html?lang=fr">
    <link rel="alternate" hreflang="x-default" href="https://pickleballrulesquiz.com/404.html">

    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16x16.png">
    <link rel="icon" href="./icons/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./style.css">
</head>

<body class="wt-page--doc">
    <a href="#main-content" class="wt-skip-link" data-wt-wording="common.skipToMain">Skip to main content</a>
    <div class="wt-app">
        <main id="main-content" class="wt-main">
            <div class="wt-container">

                <div class="wt-card wt-card--hero">
                    <h1 class="wt-h1" data-wt-wording="notFound.title">
                        Out of bounds.
                    </h1>

                    <p class="wt-muted" data-wt-wording="notFound.line1">
                        This page landed outside the court.

                    </p>

                    <p class="wt-muted" data-wt-wording="notFound.line2">
                        The good news: Pickleball Rules Quiz is still ready to play.
                    </p>

                    <div class="wt-actions">
                        <a href="./" class="wt-btn wt-btn--primary" data-wt-wording="notFound.cta" data-wt-href="common.homeHref">
                            Back to the court
                        </a>
                    </div>
                </div>

            </div>


        </main>

        <footer id="wt-footer-root" class="wt-footer" role="contentinfo"></footer>
    </div>

    <!-- Config + i18n + wording + email + footer + toggle -->
    <!-- ORDER MATTERS: i18n.js must run BEFORE wording.js (it sets WT_WORDING from WT_WORDING_ALL[activeLocale]) -->
    <script src="./config.js"></script>
    <script src="./wording-en.js"></script>
    <script src="./wording-fr.js"></script>
    <script src="./wording-bootstrap.js"></script>
    <script src="./i18n.js"></script>
    <script src="./wording.js"></script>
    <script src="./email.js"></script>
    <script src="./footer.js"></script>
    <script src="./i18n-toggle.js"></script>
</body>

</html>
