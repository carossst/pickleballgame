<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex,follow">
    <meta name="description" content="Liens, poster et QR code personnalisés pour les clubs et les coachs de pickleball.">
    <title>Clubs et coachs - Pickleball Rules Quiz</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32x32.png">
    <link rel="icon" href="../icons/favicon.ico" sizes="any">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../clubs.css">
    <script data-goatcounter="https://caroles.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>

<body class="wt-page--doc">
    <div class="wt-app">
        <main id="main-content" class="wt-main">
            <div class="wt-container wt-container--doc">
                <div class="wt-card">
                    <nav class="wt-doc-nav">
                        <a href="../" class="wt-btn wt-btn--ghost" data-c="back">Retour au quiz</a>
                    </nav>

                    <h1 class="wt-h1" data-c="title"></h1>
                    <p class="wt-press-lead" data-c="lead"></p>

                    <form class="clubs-form" id="clubs-form" autocomplete="off">
                        <label class="wt-label" for="club-name" data-c="nameLabel"></label>
                        <input class="wt-input" id="club-name" name="name" type="text" maxlength="60" data-c="namePlaceholder">

                        <div class="clubs-row">
                            <div>
                                <label class="wt-label" for="club-kind" data-c="kindLabel"></label>
                                <select class="wt-input" id="club-kind" name="kind"></select>
                            </div>
                            <div>
                                <label class="wt-label" for="club-lang" data-c="langLabel"></label>
                                <select class="wt-input" id="club-lang" name="lang"></select>
                            </div>
                        </div>
                    </form>

                    <p class="wt-muted" id="clubs-empty" data-c="empty"></p>
                    <div id="clubs-results" hidden></div>
                </div>
            </div>
        </main>
    </div>

    <script src="../poster-qr-vendor.js"></script>
    <script src="../club-link.js"></script>
    <script src="../clubs.js"></script>
</body>

</html>
