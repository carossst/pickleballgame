  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

<body>
  <!-- Fallback sans JavaScript -->
  <noscript>
    <div class="wt-noscript">
      <div class="wt-noscript-content">

  </noscript>

  <!-- Skip link for accessibility -->
  <a href="#main-content" class="wt-skip-link" data-wt-wording="common.skipToMain">Skip to main content</a>
  <!-- App shell -->
  <div class="wt-app">
    <main id="main-content" class="wt-main">
      <div class="wt-container">
        <div id="app" tabindex="-1" aria-live="off" aria-label="Pickleball Rules Quiz game content" data-wt-aria-label="common.gameContentAria"></div>

      <div id="modal-content" class="wt-modal wt-anim-in" role="document"></div>
    </div>

  </div>

  <!-- Toast containers -->
  <div id="toast" class="wt-toast" role="status" aria-live="polite"></div>

  <div id="answer-feedback" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

  <div id="update-toast" class="wt-toast" role="status" aria-live="polite">
    <div class="wt-row wt-row--spaced wt-row--tight">
      <span data-wt-update-text data-wt-wording="system.updateAvailable"></span>
      <button class="wt-btn wt-btn--secondary" data-action="apply-update" data-wt-aria-label="system.updateNow"
        data-wt-wording="system.updateNow"></button>
    </div>
  </div>

  <script defer src="./wording-en.js"></script>
  <script defer src="./wording-fr.js"></script>
  <script defer src="./wording-bootstrap.js"></script>
